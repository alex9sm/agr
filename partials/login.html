<h2>Customer Portal Login</h2>

<p>Existing customers can sign in to access the customer portal, downloads, license keys, and support tickets.</p>

<!-- No backend yet: every attempt reports that the account does not exist. -->
<form class="login" hx-on:submit="event.preventDefault(); this.password.value = ''; this.querySelector('.error').hidden = false;">
  <table class="spec">
    <tr>
      <th><label for="login-user">Username</label></th>
      <td><input id="login-user" name="username" type="text" autocomplete="username" required></td>
    </tr>
    <tr>
      <th><label for="login-pass">Password</label></th>
      <td><input id="login-pass" name="password" type="password" autocomplete="current-password" required></td>
    </tr>
  </table>
  <button type="submit">Log In</button>
  <p class="error mono" role="alert" hidden>This account does not exist.</p>
</form>

<p>Not a customer yet? <a href="#contact" hx-get="partials/contact.html" hx-target="#content">Contact us &raquo;</a></p>
